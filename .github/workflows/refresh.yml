name: Refresh

# The scheduled refresh, moved off the Vultr worker that used to run it from a
# systemd timer. That box is gone and the roughly 336 MB accession/price cache
# it held went with it, which is what makes a hosted runner a reasonable target
# now: the worker's one real advantage was holding that cache, and there is no
# longer a cache to hold. docs/DEPLOYMENT.md records what the old shape was.
#
# What this does is the same chain the systemd unit ran, in the same order:
# refresh the mutable SEC submission heads, download only unseen accession
# documents, refresh prices and configured fundamentals, rebuild the 193 static
# company pages, package the public HTML, and deploy the prebuilt output to
# Vercel. scripts/run_scheduled_refresh.sh is the single source of that order --
# this workflow sets the environment it expects and calls it, rather than
# restating the steps and letting the two drift.

# Weekly, plus on demand. A nightly cron was the first shape, inherited from the
# systemd timer this replaced, and it was too much: crawling 12,000 filings to
# publish a page nobody opened that day is rude to the SEC and buys nothing.
# On demand alone was too little, for a reason that has nothing to do with
# freshness -- GitHub disables scheduled workflows in a public repository after
# 60 days without repository activity, so a repository whose only schedule was
# the watchdog had the watchdog depending on someone happening to commit. A
# weekly run commits its receipt, which keeps both workflows alive.
#
# Saturday 07:20 UTC: after Friday's close with hours to spare, so the run sees
# the whole trading week and Friday's settled prices; before the Monday 12:15
# UTC watchdog, so what it checks is at most two days old. Not on the hour,
# because the top of the hour is GitHub's worst window for `schedule` -- runs
# are delayed there and queued jobs can be dropped.
#
# One interaction worth knowing: an Actions cache is evicted after 7 days
# without access, and a weekly cadence sits exactly on that boundary. A late
# run can tip past it, and then the restore misses and this crawls from scratch
# -- 45 minutes instead of a few. That is handled rather than prevented: the run
# detects the miss and ingests. If the full crawls become frequent, a second
# weekday run would keep the cache warm.
#
# Run it from the Actions tab, or:  gh workflow run refresh.yml
on:
  schedule:
    - cron: "20 7 * * 6"
  workflow_dispatch:
    inputs:
      full_ingest:
        description: "Crawl from scratch instead of refreshing (needed once, after a cache loss)"
        type: boolean
        default: false

# The systemd unit used flock so two runs could not overlap. This is that
# guarantee: a second run waits rather than fetching the same accessions twice
# and racing the same cache.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write  # only to commit the refresh receipt below

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # a cold crawl is ~30-60 min; an incremental one, a few
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Core dependencies only. requirements.lock is the right install for
      # reproducing committed evidence, but it carries the optional [nlp] and
      # [ts] stacks -- torch, transformers, chronos -- and no step below touches
      # a transformer or a forecaster. Installing them here would add gigabytes
      # to every nightly run to import nothing.
      - run: pip install -e .

      # The cache is what makes this incremental, and losing it is the only
      # expensive failure here: edgar.py skips any accession document already on
      # disk, so a restored cache turns a 12,000-request crawl into a handful of
      # requests for what was filed since the last run.
      #
      # Restored by prefix because a cache entry is immutable once written -- the
      # run below saves under a new key every time and restore-keys picks up the
      # most recent of them.
      - name: Restore the SEC and price cache
        uses: actions/cache/restore@v4
        with:
          # Two kinds of thing, both under the gitignored data/build/.
          #
          # universe.csv is cached rather than rebuilt each run so the page set
          # stays stable: it is scraped from a live listing, and a universe that
          # quietly changes membership overnight changes which companies the
          # site is about.
          #
          # The panels -- events.parquet, prices.parquet, membership.csv -- are
          # what `cli ingest` merges the crawl into, and every refresh script
          # downstream reads them rather than the raw cache. Leaving them out
          # cost a run: the scheduled job restored a warm data/cache, found no
          # panels, and died on `missing local event panel`. The generated HTML
          # beside them is not cached, because it is rebuilt every run by design.
          # Do not add data/build/financial_results here. actions/cache versions
          # an entry by the path list, so a longer list cannot see the caches
          # already saved with this list. Filed results are rebuilt from
          # data/cache Company Facts, which this list already includes.
          path: |
            data/cache
            data/build/*.parquet
            data/build/*.csv
            data/build/*.json
          key: company-lens-cache-${{ github.run_id }}
          restore-keys: |
            company-lens-cache-

      - name: Refresh, rebuild and deploy
        env:
          # The SEC requires a real name and address; a run without it gets
          # refused, and edgar.py raises rather than crawling anonymously.
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_ENABLED: "1"
          # The script defaults these to paths under /opt/company-lens via its
          # environment file. On a runner they belong in the workspace.
          COMPANY_LENS_PYTHON: python
          COMPANY_LENS_LOCK_FILE: ${{ runner.temp }}/company-lens-refresh.lock
          COMPANY_LENS_HEADLINE_INDEX: ${{ github.workspace }}/data/build/headlines.json
          VERCEL_BUNDLE_ROOT: ${{ github.workspace }}/data/build/vercel_frontend
          VERCEL_GLOBAL_CONFIG: ${{ runner.temp }}/vercel-cli
        run: |
          set -euo pipefail
          # Unpinned, matching docs/DEPLOYMENT.md. Pin it here if a CLI release
          # ever breaks `deploy --prebuilt`; nothing else depends on the version.
          npm install --global vercel

          # Self-healing on a cache miss: without the universe the refresh
          # scripts have no issuer list to refresh. This comes before `doctor`
          # because doctor checks that the universe file exists -- putting the
          # check first made a cold start fail on the one condition the very
          # next line repairs.
          if [ ! -f data/build/universe.csv ]; then
            echo "::notice::no universe.csv in the cache; rebuilding it"
            mkdir -p data/build
            PYTHONPATH=src python scripts/build_demo_universe.py --out data/build/universe.csv
          fi

          # Everything a real pull needs, checked in seconds. A rejected
          # User-Agent discovered at minute fifty of a crawl wastes an hour and
          # the SEC's patience; this is the same check `make doctor` runs.
          PYTHONPATH=src python -m filing_triage.cli doctor

          # A cache miss leaves nothing for an incremental refresh to be
          # incremental against, so the ingest has to happen whether or not it
          # was asked for. edgar.py skips documents already on disk, so against
          # a warm cache this re-merges the panels in minutes; against a cold
          # one it is the full ~45-minute crawl.
          #
          # Missing panels count as a miss even when data/cache is warm. That is
          # the state the first scheduled run found itself in, and it failed
          # rather than repairing itself.
          if [ "${{ inputs.full_ingest }}" = "true" ] \
            || [ ! -d data/cache/edgar ] \
            || [ ! -f data/build/events.parquet ] \
            || [ ! -f data/build/prices.parquet ]; then
            echo "::notice::ingesting (cold cache, missing panels, or asked for)"
            PYTHONPATH=src python -m filing_triage.cli ingest
          fi

          scripts/run_scheduled_refresh.sh

      # Saved even when the step above failed. A crawl that died at request
      # 9,000 of 12,000 has 9,000 documents on disk, and throwing that away
      # means the next run pays for them again -- the resumability the cache
      # provides is only real if a failed run still writes it.
      - name: Save the cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache
            data/build/*.parquet
            data/build/*.csv
            data/build/*.json
          key: company-lens-cache-${{ github.run_id }}

      # The audit trail the Vultr timer never had -- the reason nobody noticed it
      # had stopped on 2026-08-27 is that a run which does not happen leaves no
      # trace anywhere in this repository. This one records every run, including
      # the failures, with a link to its log.
      #
      # It also carries the prospective prediction log, and that is the part of
      # this step that is load-bearing rather than merely tidy. The log's whole
      # claim is that a ranking existed in a public repository before the prices
      # it is judged against did, and the commit this step pushes is what
      # timestamps it. A refresh that ranked filings and did not push them has
      # produced nothing. [skip ci] because the test suite has nothing to say
      # about a timestamp -- and the next ordinary push runs the immutability
      # guard over everything this one added.
      - name: Record the refresh
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Hold the log aside across the reset below. It is the only tracked
          # file a refresh writes, so it is the one thing `--hard` can destroy,
          # and a scored outcome lost here would be re-derived next week from
          # vendor prices that have been re-adjusted since -- which is precisely
          # the drift the log exists to make impossible. Copied rather than
          # stashed: a stash pop can conflict, and this step runs `if: always()`
          # on runs that have already failed once.
          mkdir -p "${{ runner.temp }}/log"
          cp predictions/*.json "${{ runner.temp }}/log/" 2>/dev/null || true

          # Move onto the current remote tip before writing anything. A run
          # takes a while and anything landing on main meanwhile would make this
          # push a non-fast-forward -- which is what marked an earlier run failed
          # while the site it published was correct.
          #
          # Done by reset rather than rebase because actions/checkout is shallow:
          # there is no common ancestor to rebase onto, so `git rebase` exits
          # `fatal: no rebase in progress` and the receipt quietly does not land.
          # That is how the first version of this fix stayed green while doing
          # nothing, which is the exact failure this file exists to prevent.
          #
          # --hard discards nothing else: every other artifact a refresh produces
          # is under the gitignored data/build and data/cache, and the receipt is
          # written after the reset.
          git fetch origin main --depth=1
          git reset --hard FETCH_HEAD

          # Back on top of the new tip. Only the log's own JSON moves: a
          # prediction file someone else pushed meanwhile, or an edit to the
          # directory's README, belongs to the tip and is left as the tip has it
          # rather than being reverted to this run's hour-old checkout.
          mkdir -p predictions
          cp "${{ runner.temp }}/log/"*.json predictions/ 2>/dev/null || true

          mkdir -p data
          cat > data/last-refresh.json <<JSON
          {
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "${{ job.status }}",
            "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          git add data/last-refresh.json predictions
          git diff --staged --quiet && exit 0
          git commit -m "Refresh: ${{ job.status }} [skip ci]"

          # A receipt that cannot land is not worth failing a good run over, so
          # this warns. But the warning has to be read: this commit is what
          # resets GitHub's 60-day inactivity clock, so a receipt that stops
          # landing is how both schedules get disabled with nothing going red.
          git push origin HEAD:main || echo "::warning::could not push the refresh receipt"
