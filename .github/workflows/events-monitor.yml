name: Events monitor

# Reads task checkpoints. A page that returns HTTP 200 is not a pass.
# Without both rerun credentials this job reports health only.
# This GitHub workflow is not an independent wake or a notification channel.
# Production health checks run every fifteen minutes for the released scope.

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime with reviewed dependency constraints
        run: |
          python -m pip install -c requirements.lock -e .
          python -m pip check

      - name: Report durable checkpoint health
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          EVENTS_BLOB_PREFIX: lens-events
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          EVENTS_RERUN_TOKEN: ${{ secrets.EVENTS_RERUN_TOKEN }}
          EVENTS_RERUN_URL: ${{ secrets.EVENTS_RERUN_URL }}
        run: |
          set -euo pipefail
          # This workflow is not an independent wake. A rerun happens only when
          # EVENTS_RERUN_URL is configured, and the script calls that URL itself.
          # The released health set is the three verified companies, not the other
          # seventeen high-frequency names.
          python scripts/events_monitor.py --supported AAPL JPM NVDA \
            | tee "${{ runner.temp }}/events-health.txt"

      - name: Retain public health observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/events-health.txt
          if-no-files-found: warn
          retention-days: 14
