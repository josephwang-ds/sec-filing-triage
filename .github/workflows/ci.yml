name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, which the default shallow checkout does not give.
          # tests/test_prediction_log.py asks git what each published prediction
          # said in the commit that introduced it, and that check is the one that
          # does not rest on the author having left the file alone -- a digest
          # committed beside the file it pins can be moved by the same commit.
          # Without history the test skips and the weaker check carries the build.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Through make, so CI and a developer's terminal run the same command. The
      # two had drifted -- CI linted src and tests, the Makefile also linted
      # scripts -- and a check that differs from the one people run locally
      # fails for reasons nobody can reproduce.
      - run: make lint
      - run: make test

  # The floors in pyproject.toml are `>=`, so the job above tests against
  # whatever is newest today -- which is what catches an upstream break early.
  # This one tests against the pins that produced the committed evidence, which
  # is what makes that evidence reproducible. Both matter, and they answer
  # different questions: the first is "does it still work", the second is "can
  # anyone get these numbers back".
  locked-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the prediction log's git check; see the job above
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: python -m pytest -q

  leakage-audit:
    # The point of the project as an exit code. If the honest pipeline ever
    # starts leaking, this fails before anything reaches main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python -m filing_triage.cli audit
