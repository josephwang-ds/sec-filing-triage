name: Blob checkpoint diagnosis
on:
  push:
    branches: [codex/blob-checkpoint-diagnosis]
    paths: [.github/workflows/blob-checkpoint-diagnosis.yml]
permissions:
  contents: read
jobs:
  read-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements.lock requests
      - name: Diagnose checkpoint without writing to Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          import os
          from runpy import run_path

          module = run_path('src/company_lens/events/blob_store.py')
          BlobRequestError = module['BlobRequestError']
          HttpBlobTransport = module['HttpBlobTransport']
          commit_path = module['commit_path']
          read_commit = module['read_commit']

          def probe(label, read):
              try:
                  result = read()
              except BlobRequestError as exc:
                  print(f"{label}=blob_error http_status={exc.status}")
              except (OSError, ValueError) as exc:
                  print(f"{label}=error type={type(exc).__name__}")
              else:
                  print(f"{label}=ok")
                  return result

          token = os.environ.get("BLOB_READ_WRITE_TOKEN")
          if not token:
              print("blob_token=missing")
              raise SystemExit
          transport = HttpBlobTransport(token)
          listed = probe("list_commit", lambda: transport.get_prefix(commit_path()))
          if listed is not None:
              print(f"commit_listed={any(item.get('pathname') == commit_path() for item in listed)}")
          if listed:
              import requests
              from urllib.parse import urlsplit
              for item in listed:
                  if item.get("pathname") != commit_path():
                      continue
                  url = item.get("url", "")
                  parsed = urlsplit(url)
                  host = parsed.hostname or ""
                  print(f"commit_private_host={host.endswith('.private.blob.vercel-storage.com')}")
                  if parsed.scheme == "https" and host.endswith(".blob.vercel-storage.com"):
                      for label, params in [("plain", {}), ("origin", {"cache": "0"})]:
                          response = requests.get(url, params=params, headers={"Authorization": f"Bearer {token}"}, timeout=15, allow_redirects=False)
                          for code in ("BLOB_STORE_SUSPENDED", "BLOB_STORE_DISABLED", "BLOB_ACCESS_DENIED", "FORBIDDEN", "UNAUTHORIZED", "INVALID_TOKEN", "DEPLOYMENT_DISABLED", "BLOB_STORE_NOT_FOUND", "usage limit", "spend limit", "suspended", "disabled", "invalid token", "access denied"):
                              if code.lower() in (response.text[:4096] + response.headers.get("x-vercel-error", "")).lower():
                                  print(f"vercel_error_indicator={code}")
                          print(f"direct_{label}_status={response.status_code} etag_present={bool(response.headers.get('etag'))}")
          commit_result = probe("read_commit", lambda: read_commit(transport))
          if commit_result:
              commit, etag = commit_result
              print(f"commit_etag_present={bool(etag)}")
              url = commit.get("checkpoint_url")
              print(f"checkpoint_reference_present={bool(url)}")
              if url:
                  from urllib.parse import urlsplit
                  parsed = urlsplit(url)
                  if parsed.scheme == "https" and (parsed.hostname or "").endswith(".private.blob.vercel-storage.com"):
                      result = probe("read_checkpoint", lambda: transport.read_url(url))
                      if result:
                          body, _ = result
                          payload = probe("decode_checkpoint", lambda: json.loads(body))
                          print(f"checkpoint_is_object={isinstance(payload, dict)}")
                  else:
                      print("checkpoint_url=unexpected_host")
          PY
