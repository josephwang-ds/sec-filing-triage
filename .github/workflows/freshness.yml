name: Freshness

# A watchdog, and the thing whose absence cost the most: the refresh stopped on
# 2026-08-27 and the site went on serving that date for 53 days without anything
# anywhere going red. Every company page prints the date its SEC cache was
# collected, so staleness is already published -- it just needed something to
# read it and fail.
#
# This deliberately does no work and holds no state. It fetches one public page
# and compares one date, which is what a hosted runner is actually good at, and
# it stays useful whether the refresh runs here, on a VPS, or by hand.

# Weekly, one day after the weekly refresh. A daily check against a six-day limit
# made sense when the refresh ran every weekday; against a weekly one it would
# mostly report a staleness that is simply the schedule.
#
# The limit stays generous on purpose. GitHub delays `schedule` events and drops
# queued ones -- this repository has already seen a cron fire 2h27m late -- so a
# limit tight enough to notice one missed Saturday would mostly report on the
# scheduler rather than on the site. Thirty days means four consecutive weekly
# runs vanished, which is rot rather than lateness, and is still well short of
# the 53 days the previous arrangement managed before anyone noticed.
on:
  schedule:
    - cron: "15 12 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The live site should not be serving a stale cache
        env:
          PAGE: https://lens.josephjwang.com/aapl.html
          # Not "is it current" any more -- on demand means stale by choice --
          # but "has it rotted". A month is past the point where a reader who
          # followed the README link would notice, and well short of the 53 days
          # the last arrangement managed before anyone did.
          MAX_AGE_DAYS: "30"
        run: |
          set -euo pipefail
          # Every company page tags its freshness markers with
          # data-freshness-date: one for the issuer's own latest filing, one for
          # the day the SEC was last checked. The second is always the later of
          # the two, so the maximum is the page's own answer to "when was this
          # refreshed". Read from the attribute rather than the visible label,
          # which is translated and has already been reworded once.
          collected="$(curl -sS -L --max-time 30 "$PAGE" \
            | grep -oE 'data-freshness-date="[0-9]{4}-[0-9]{2}-[0-9]{2}"' \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' \
            | sort | tail -1)"
          if [ -z "$collected" ]; then
            echo "::error::no freshness date found on $PAGE -- the page shape changed, or the site is down"
            exit 1
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$collected" +%s) ) / 86400 ))
          echo "published data is from $collected, $age day(s) ago"
          if [ "$age" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error::the published site is $age days old (limit $MAX_AGE_DAYS); run the Refresh workflow"
            exit 1
          fi
