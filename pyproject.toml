[project]
name = "filing-triage"
version = "0.1.0"
description = "Point-in-time SEC filing triage: which disclosures deserve a human read?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "requests>=2.31",
    "lxml>=5.0",          # pandas.read_html, for scripts/build_universe.py
    "yfinance>=0.2.40",   # primary daily price source
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
rag = ["langchain-text-splitters>=1.0,<2.0", "pypdf>=5.0,<7.0"]
# Financial-domain transformer features. Optional because torch is ~100 MB and
# the whole project -- pipeline, evidence, every page -- runs without it; the
# transformer columns simply do not appear.
nlp = ["torch>=2.0", "transformers>=4.40"]
# The time-series foundation model. Separate from [nlp] because the volatility
# experiment and the filing ranker share no code path -- installing one should
# not drag in the other.
ts = ["torch>=2.0", "chronos-forecasting>=2.0"]

[project.scripts]
triage = "filing_triage.cli:main"
company-lens = "company_lens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# src-layout on the path explicitly, rather than relying on the editable
# install's .pth file resolving. On macOS an iCloud-synced checkout gets
# UF_HIDDEN re-applied to everything under .venv/, and CPython *silently*
# skips hidden .pth files -- so `pip install -e .` reports success and the
# package is still unimportable. This makes `make test` independent of that.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Selected explicitly rather than left to the defaults. Ruff's default set is
# version-dependent, so an unpinned config lints differently on a contributor's
# machine than in CI -- which is exactly what happened here: clean locally, 35
# findings on the runner. An explicit list makes the two agree.
[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "PIE", "ISC",    # misc lint, implicit string concat
    "DTZ",           # naive datetimes -- load-bearing in a project about timestamps
    "BLE",           # blind excepts -- used deliberately in the ingest loop, each with a reason
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# The clock must reject naive datetimes, so its tests have to construct them.
"tests/test_pit.py" = ["DTZ001"]
# scripts/ is imported after a sys.path insert, which has to come first.
"tests/test_build_universe.py" = ["E402"]
# Self-contained HTML and minified CSS/JS are intentionally embedded as long literals.
"src/company_lens/web/page.py" = ["E501"]
# Event copy, policy prose, and fixtures are long on purpose.
"src/company_lens/events/*.py" = ["E501", "RUF001"]
"scripts/refresh_events.py" = ["E501"]
"scripts/events_monitor.py" = ["E501"]
"tests/test_events_a1.py" = ["E501"]
"tests/test_events_api.py" = ["E501"]
"tests/test_events_closure.py" = ["E501"]
# Full-width Chinese punctuation is an intentional document-splitting boundary.
"src/company_lens/llm/retrieval.py" = ["RUF001"]
